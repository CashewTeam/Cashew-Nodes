name: Publish Blender repositories

on:
  push:
    branches:
      - For_5.2_NPR
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'For_5.2_NPR'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Blender 5.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          blender_version="5.2.0"
          blender_archive="blender-${blender_version}-linux-x64.tar.xz"
          blender_url="https://download.blender.org/release/Blender5.2/${blender_archive}"
          curl --fail --location --retry 3 "$blender_url" --output "$RUNNER_TEMP/$blender_archive"
          tar -xJf "$RUNNER_TEMP/$blender_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-${blender_version}-linux-x64" >> "$GITHUB_PATH"

      - name: Build current extension and clean old Cashew Nodes packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' blender_manifest.toml)"
          branch_name="$GITHUB_REF_NAME"
          archive="Addon_releases/new/Cashew_Nodes_${version}_${branch_name}.zip"
          test -n "$version"
          mkdir -p Addon_releases/new
          build_source="$RUNNER_TEMP/cashew-nodes-source"
          mkdir -p "$build_source"
          rsync -a --exclude='Addon_releases/' "$GITHUB_WORKSPACE/" "$build_source/"

          blender --background --factory-startup \
            --command extension build \
            --source-dir="$build_source" \
            --output-filepath="$GITHUB_WORKSPACE/$archive"

          python - "$archive" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as package:
              assert not any(
                  "Addon_releases" in member.split("/")
                  for member in package.namelist()
              ), "Addon_releases must not be included in the extension package"
          PY

          python - <<'PY'
          import re
          import tomllib
          import zipfile
          from pathlib import Path

          def version(path):
              try:
                  with zipfile.ZipFile(path) as package:
                      manifest = next(
                          name for name in package.namelist()
                          if Path(name).name == "blender_manifest.toml"
                      )
                      value = tomllib.loads(
                          package.read(manifest).decode("utf-8")
                      )["version"]
                      return tuple(int(part) for part in value.split("."))
              except (KeyError, StopIteration, ValueError, tomllib.TOMLDecodeError):
                  match = re.search(r"(?<!\d)\d+(?:\.\d+)+", path.stem)
                  return tuple(int(part) for part in match.group().split(".")) if match else ()

          new_dir = Path("Addon_releases/new")
          packages = sorted(
              path for path in new_dir.glob("*.zip")
              if path.stem.casefold().replace("-", "_").startswith("cashew_nodes")
          )
          if len(packages) > 1:
              keep = max(packages, key=lambda path: (version(path), path.name))
              for package in packages:
                  if package != keep:
                      package.unlink()
          PY

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Persist latest packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Addon_releases \
            && [[ -z "$(git ls-files --others --exclude-standard -- Addon_releases)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Addon_releases
          git commit -m "发布 Cashew Nodes ${{ steps.package.outputs.version }}"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Prepare repository files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/extensions site/assets

          while IFS= read -r -d '' archive; do
            if [[ "$archive" == "Addon_releases/archive/Cashew_Nodes  Alpha 1.0 For 3.6.zip" ]]; then
              continue
            fi

            archive_name="$(basename "$archive")"
            target="site/extensions/$archive_name"
            if [[ -e "$target" ]]; then
              echo "Duplicate extension archive name: $archive_name" >&2
              exit 1
            fi
            cp "$archive" "$target"
          done < <(find Addon_releases -type f -name '*.zip' -print0 | sort -z)

          cp Cashew_Nodes_Library/Cashew_Nodes.blend site/assets/
          cp Cashew_Nodes_Library/NPR.blend site/assets/
          cp Cashew_Nodes_Library/blender_assets.cats.txt site/assets/
          touch site/.nojekyll

      - name: Generate extension repository listing
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup \
            --command extension server-generate \
            --repo-dir="$GITHUB_WORKSPACE/site/extensions" \
            --html
          python - <<'PY'
          import json
          from functools import cmp_to_key
          from pathlib import Path

          def semver(value):
              core, _, prerelease = value.partition("-")
              core = tuple(int(part) for part in core.split("+", 1)[0].split("."))
              identifiers = [] if not prerelease else prerelease.split("+", 1)[0].split(".")
              return core, identifiers

          def compare_semver(left, right):
              left_core, left_pre = semver(left)
              right_core, right_pre = semver(right)
              if left_core != right_core:
                  return (left_core > right_core) - (left_core < right_core)
              if not left_pre or not right_pre:
                  return (bool(left_pre) < bool(right_pre)) - (bool(left_pre) > bool(right_pre))
              for left_id, right_id in zip(left_pre, right_pre):
                  if left_id == right_id:
                      continue
                  left_num = left_id.isdigit()
                  right_num = right_id.isdigit()
                  if left_num and right_num:
                      return (int(left_id) > int(right_id)) - (int(left_id) < int(right_id))
                  if left_num != right_num:
                      return -1 if left_num else 1
                  return (left_id > right_id) - (left_id < right_id)
              return (len(left_pre) > len(right_pre)) - (len(left_pre) < len(right_pre))

          def compare(left, right):
              if left["id"] != right["id"]:
                  return (left["id"] > right["id"]) - (left["id"] < right["id"])
              return -compare_semver(left["version"], right["version"])

          index_path = Path("site/extensions/index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          index["data"].sort(key=cmp_to_key(compare))
          index_path.write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate remote asset listing
        shell: bash
        run: |
          set -euo pipefail
          blender -q -b -c asset_listing generate "$GITHUB_WORKSPACE/site/assets"
          python - <<'PY'
          import json
          from pathlib import Path

          meta_path = Path("site/assets/_asset-library-meta.json")
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          meta["name"] = "Cashew Nodes Library"
          meta["contact"] = {
              "name": "CashewTeam",
              "url": "https://github.com/CashewTeam/Cashew_Nodes",
              "email": "cashewteam@outlook.com",
          }
          meta_path.write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate generated repositories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          root = Path("site")
          extension_dir = root / "extensions"
          expected_archives = {
              path.name
              for path in Path("Addon_releases").rglob("*.zip")
              if path.as_posix()
              != "Addon_releases/archive/Cashew_Nodes  Alpha 1.0 For 3.6.zip"
          }
          published_archives = {path.name for path in extension_dir.glob("*.zip")}
          assert published_archives == expected_archives, (
              published_archives,
              expected_archives,
          )

          for archive in sorted(extension_dir.glob("*.zip")):
              with zipfile.ZipFile(archive) as package:
                  assert any(
                      Path(member).name == "blender_manifest.toml"
                      for member in package.namelist()
                  ), archive

          extension_index = json.loads(
              (extension_dir / "index.json").read_text(encoding="utf-8")
          )
          listed_archives = {
              Path(item["archive_url"].split("?", 1)[0]).name
              for item in extension_index["data"]
          }
          assert listed_archives == expected_archives, (
              listed_archives,
              expected_archives,
          )

          def semver_core(value):
              return tuple(
                  int(part)
                  for part in value.split("-", 1)[0].split("+", 1)[0].split(".")
              )

          for previous, current in zip(extension_index["data"], extension_index["data"][1:]):
              if previous["id"] == current["id"]:
                  assert semver_core(previous["version"]) >= semver_core(current["version"]), (
                      previous["id"],
                      previous["version"],
                      current["version"],
                  )

          asset_root = root / "assets"
          asset_index = asset_root / "_v1/asset-index.json"
          meta = json.loads(
              (asset_root / "_asset-library-meta.json").read_text(encoding="utf-8")
          )
          version = meta["api_versions"]["v1"]
          assert version["url"] == "_v1/asset-index.json"
          actual_hash = hashlib.sha256(asset_index.read_bytes()).hexdigest()
          assert version["hash"].lower() == f"sha256:{actual_hash}"
          assert (asset_root / "Cashew_Nodes.blend").is_file()
          assert (asset_root / "NPR.blend").is_file()
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${{ steps.package.outputs.version }}-${GITHUB_REF_NAME}"
          target_commit="$(git rev-parse HEAD)"
          mapfile -d '' release_assets < <(
            find Addon_releases -type f -name '*.zip' -print0 |
              while IFS= read -r -d '' asset; do
                case "$(basename "$asset")" in
                  Cashew_Nodes*.zip) printf '%s\0' "$asset" ;;
                esac
              done |
              sort -z
          )
          test "${#release_assets[@]}" -gt 0

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${release_assets[@]}" --clobber
            gh release edit "$release_tag" \
              --title "Cashew Nodes ${{ steps.package.outputs.version }} ($GITHUB_REF_NAME)"
          else
            gh release create "$release_tag" "${release_assets[@]}" \
              --target "$target_commit" \
              --title "Cashew Nodes ${{ steps.package.outputs.version }} ($GITHUB_REF_NAME)" \
              --generate-notes
          fi
